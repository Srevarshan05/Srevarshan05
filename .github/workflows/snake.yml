name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1b1b1b&color_dots=#ebe6da,#f7c59f,#f0a06a,#e8590c,#a33b05
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f4f1ea&color_dots=#161b22,#5a2a0e,#8f3d0a,#c94f0b,#ff7a2e

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
